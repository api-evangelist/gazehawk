name: GazeHawk
description: >-
  GazeHawk was a webcam-based eye-tracking startup founded in December 2009 by
  Brian Krausz and Joe Gershenson, offering affordable eye-tracking usability and
  ad-testing services that ran on ordinary consumer webcams instead of expensive
  dedicated hardware. Backed by Y Combinator (S10) and 500 Startups, the company
  was acqui-hired by Facebook in March 2012 — Facebook hired the engineering team
  but explicitly did not acquire the product or technology, and the founders moved
  on to unrelated backend and product engineering. GazeHawk operated no public API,
  developer portal, or SDKs; the domain today serves only a legacy static marketing
  and blog site for the defunct product.
